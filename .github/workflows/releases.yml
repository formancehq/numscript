name: Release
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  GoReleaser:
    uses: formancehq/ci/.github/workflows/go-release.yml@main
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    secrets:
      NUMARY_GITHUB_TOKEN: ${{ secrets.NUMARY_GITHUB_TOKEN }}
      GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
