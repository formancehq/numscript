name: Default
on:
  merge_group:
  push:
    branches:
      - main
      - release/*
      - releases/*
  pull_request:
    types: [ assigned, opened, synchronize, reopened, labeled, edited ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  PR:
    if: github.event_name == 'pull_request'
    uses: formancehq/ci/.github/workflows/go-pr.yml@v1
    permissions:
      pull-requests: read
      statuses: write

  Dirty:
    uses: formancehq/ci/.github/workflows/go-dirty.yml@v1

  Tests:
    uses: formancehq/ci/.github/workflows/go-test.yml@v1
    with:
      runner-profile: namespace-profile-linux-amd64-4vcpu
      enable-codecov: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  GoReleaser:
    needs: [Dirty]
    uses: formancehq/ci/.github/workflows/go-build.yml@v1
    with:
      build-condition: main-and-label
      build-label: build-images
    secrets:
      NUMARY_GITHUB_TOKEN: ${{ secrets.NUMARY_GITHUB_TOKEN }}
      GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}

  Difftest:
    runs-on: ubuntu-latest
    # -fuzztime bounds the fuzzing phase only, not module downloads or builds.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # internal/oracle and internal/difftest are separate Go modules, so the
      # root module's `go test ./...` never reaches them. Without this job the
      # differential harness would sit in the repo and never run.
      - name: oracle module
        working-directory: internal/oracle
        run: go test ./...
      - name: difftest seed corpus and regressions
        working-directory: internal/difftest
        run: go test ./...
      # The committed corpus is only 3 seeds, so the regression tests alone are
      # weak coverage. This burst is where divergences actually get found.
      - name: difftest fuzz burst
        working-directory: internal/difftest
        run: go test -run '^$' -fuzz FuzzDiff -fuzztime 60s .
